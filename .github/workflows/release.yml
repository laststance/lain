name: Release

# Signed + notarized macOS release, same flow as laststance/corelive's build-and-release.yml.
#
# - Tag push (v*): import the Developer ID cert into a temp keychain, build arm64 + x64,
#   let electron-builder sign + notarize the app, notarize + staple the DMGs
#   (scripts/finalize-mac-release-artifacts.ts), then upload to a DRAFT GitHub Release.
# - Pull request touching packaging files: unsigned `--dir` build only, no secrets needed.
#
# Required repository secrets for tag builds:
#   VITE_RAINDROP_CLIENT_ID, RAINDROP_CLIENT_SECRET         Raindrop.io OAuth app (inlined at build time)
#   APPLE_CERTIFICATES_P12, APPLE_CERTIFICATES_PASSWORD     Developer ID Application cert (.p12 base64) + its password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID    Notarization (notarytool)
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - electron-builder.yml
      - build/**
      - electron/**
      - package.json
      - pnpm-lock.yaml
      - scripts/finalize-mac-release-artifacts.ts
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-check:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - name: Unsigned package check (no secrets)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm electron:build:dir

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare

      - name: Check release secrets
        env:
          VITE_RAINDROP_CLIENT_ID: ${{ secrets.VITE_RAINDROP_CLIENT_ID }}
          RAINDROP_CLIENT_SECRET: ${{ secrets.RAINDROP_CLIENT_SECRET }}
          APPLE_CERTIFICATES_P12: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in VITE_RAINDROP_CLIENT_ID RAINDROP_CLIENT_SECRET APPLE_CERTIFICATES_P12 APPLE_CERTIFICATES_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} — see the header of .github/workflows/release.yml"
            exit 1
          fi

      - name: Build renderer + main process
        env:
          VITE_RAINDROP_CLIENT_ID: ${{ secrets.VITE_RAINDROP_CLIENT_ID }}
          RAINDROP_CLIENT_SECRET: ${{ secrets.RAINDROP_CLIENT_SECRET }}
        run: pnpm build

      - name: Import code-signing certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}

      - name: Package, sign and notarize the app
        # Reuse the imported keychain; electron-builder's own CSC_LINK reimport mixes keychain and certificate passwords.
        run: CSC_KEYCHAIN="$HOME/Library/Keychains/signing_temp.keychain-db" pnpm exec electron-builder --mac --arm64 --x64 --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize + staple DMGs, rewrite update feed
        run: pnpm electron:finalize:mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v7
        with:
          name: lain-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/checksums.json
          retention-days: 30

      - name: Upload to draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml release/checksums.json)
          # Re-running a tag replaces the assets of the existing release instead of failing
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --generate-notes --title "Lain ${GITHUB_REF_NAME}"
          fi
