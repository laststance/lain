# electron-builder configuration — macOS only (SPEC.md §8.2)
# Build locally:  pnpm electron:build            (unsigned unless CSC_* / APPLE_* env vars are set)
# CI:             .github/workflows/release.yml  (tag push v* → draft GitHub Release)
appId: io.laststance.lain
productName: Lain
copyright: Copyright © 2026 Laststance.io

directories:
  buildResources: build
  output: release

# vite-plugin-electron bundles the main process, preload and every runtime
# dependency into dist-electron/ and dist/, so node_modules are not shipped.
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!node_modules/**'
asar: true

mac:
  category: public.app-category.productivity
  icon: build/icons/icon.icns
  minimumSystemVersion: '12.0'
  darkModeSupport: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Notarization runs only when Apple credentials are present in the environment
  # (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, or an App Store
  # Connect API key); without them electron-builder logs "skipped macOS notarization".
  notarize: true

dmg:
  background: build/dmg-background.tiff
  icon: build/icons/icon.icns
  iconSize: 128
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Auto-update feed (electron-updater) and release target for `--publish`.
# Releases are created as drafts so assets can be checked before users see them.
publish:
  provider: github
  owner: laststance
  repo: lain
  releaseType: draft
